<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — College Marketplace</title>

  <!-- Fonts: Sora (display) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#4F46E5",
            primaryHover: "#4338CA",
            bg: "#F8FAFC",
            surface: "#FFFFFF",
            ink: "#0F172A",
            danger: "#DC2626",
          },
          fontFamily: {
            display: ["Sora", "ui-sans-serif", "system-ui", "sans-serif"],
            body: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
          },
          keyframes: {
            fadeSlideIn: {
              "0%": { opacity: "0", transform: "translateY(10px)" },
              "100%": { opacity: "1", transform: "translateY(0)" },
            }
          },
          animation: {
            fadeSlideIn: "0.3s ease-out fadeSlideIn",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-ink font-body text-slate-900 antialiased">

  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 flex w-64 -translate-x-full flex-col border-r border-white/10 bg-ink text-white transition-transform duration-200 lg:translate-x-0">
    <div class="flex items-center justify-between px-5 py-5">
      <a href="dashboard.html" class="flex items-center gap-2">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-white">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M6 8h12l-1 12H7L6 8Z"/>
            <path d="M9 8V6a3 3 0 0 1 6 0v2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="font-display text-base font-bold text-white">College Marketplace</span>
      </a>
    </div>

    <nav class="flex-1 space-y-1 px-3 mt-4" aria-label="Dashboard">
      <a href="dashboard.html" class="flex items-center gap-3 rounded-lg bg-white/10 px-3 py-2.5 font-body text-sm font-semibold text-white">
        <svg class="h-5 w-5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/>
          <rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/>
        </svg>
        Listings
      </a>
    </nav>
  </aside>

  <div id="sidebar-overlay" class="fixed inset-0 z-30 hidden bg-black/50 lg:hidden"></div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="lg:pl-64 bg-slate-50 min-h-screen">
    
    <!-- Welcome Banner -->
    <section class="relative overflow-hidden bg-slate-100 border-b border-slate-200 px-4 py-14 sm:px-6 sm:py-20 lg:px-8">
      <div class="absolute -right-16 -top-16 h-64 w-64 rounded-full bg-primary/10 blur-3xl"></div>
      <div class="absolute -bottom-20 -left-10 h-64 w-64 rounded-full bg-sky-400/10 blur-3xl"></div>
      
      <div class="relative mx-auto max-w-4xl text-center">
        <!-- Title in Black -->
        <h1 class="font-display text-4xl font-bold text-black sm:text-5xl">Buy & Sell Within Your Campus</h1>
        <p class="mx-auto mt-4 max-w-xl font-body text-lg text-slate-600">The trusted peer-to-peer marketplace. Find textbooks, MacBooks, and more from fellow classmates.</p>
        
        <!-- Large Action Cards -->
        <div class="mt-12 grid grid-cols-1 gap-6 sm:grid-cols-2">
            <!-- Buy Options -->
            <a href="#listings" class="group relative flex h-48 w-full flex-col items-center justify-center overflow-hidden rounded-3xl border border-slate-200 bg-white transition-all hover:border-sky-400 hover:ring-2 hover:ring-sky-400/50 hover:shadow-2xl">
                <img src="https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=600&auto=format&fit=crop" alt="Buy Items" class="absolute inset-0 h-full w-full object-cover opacity-20 transition-transform duration-500 group-hover:scale-105 group-hover:opacity-40">
                <div class="absolute inset-0 bg-gradient-to-t from-white/90 via-white/40 to-transparent"></div>
                <div class="relative z-10 flex flex-col items-center">
                    <div class="mb-3 rounded-full bg-sky-500/20 p-4 text-sky-600 backdrop-blur-md transition-transform group-hover:-translate-y-1">
                        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                        </svg>
                    </div>
                    <!-- Action Card Title in Black -->
                    <span class="font-display text-2xl font-bold text-black tracking-wide">Buy Items</span>
                </div>
            </a>

            <!-- Sell Options -->
            <a href="#sell" class="group relative flex h-48 w-full flex-col items-center justify-center overflow-hidden rounded-3xl border border-slate-200 bg-white transition-all hover:border-emerald-400 hover:ring-2 hover:ring-emerald-400/50 hover:shadow-2xl">
                <img src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?q=80&w=600&auto=format&fit=crop" alt="Sell Items" class="absolute inset-0 h-full w-full object-cover opacity-20 transition-transform duration-500 group-hover:scale-105 group-hover:opacity-40">
                <div class="absolute inset-0 bg-gradient-to-t from-white/90 via-white/40 to-transparent"></div>
                <div class="relative z-10 flex flex-col items-center">
                    <div class="mb-3 rounded-full bg-emerald-500/20 p-4 text-emerald-600 backdrop-blur-md transition-transform group-hover:-translate-y-1">
                        <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                    </div>
                    <!-- Action Card Title in Black -->
                    <span class="font-display text-2xl font-bold text-black tracking-wide">Sell an Item</span>
                </div>
            </a>
        </div>
      </div>
    </section>

    <!-- Filters + Listings Grid -->
    <section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      
      <!-- Filter Section -->
      <div id="listings" class="mb-8 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <div class="flex items-center gap-2 mb-4">
          <svg class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
          </svg>
          <!-- Section Title in Black -->
          <h2 class="font-display text-lg font-bold text-black">Filter & Sort Listings</h2>
        </div>
        
        <div class="flex flex-col flex-wrap gap-4 md:flex-row md:items-end">
          <div class="flex-1 min-w-[150px]">
            <label class="mb-2 block font-body text-sm font-medium text-slate-600">Category</label>
            <select id="filter-category" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 font-body text-sm text-slate-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
              <option value="all">All Categories</option>
            </select>
          </div>
          <div class="w-full sm:w-36">
            <label class="mb-2 block font-body text-sm font-medium text-slate-600">Min Price (Rs.)</label>
            <input type="number" id="filter-min-price" placeholder="Rs. 0" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 font-body text-sm text-slate-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
          <div class="w-full sm:w-36">
            <label class="mb-2 block font-body text-sm font-medium text-slate-600">Max Price (Rs.)</label>
            <input type="number" id="filter-max-price" placeholder="Rs. Max" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 font-body text-sm text-slate-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
          </div>
          <div class="w-full sm:w-40">
            <label class="mb-2 block font-body text-sm font-medium text-slate-600">Sort By</label>
            <select id="filter-sort" class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-2.5 font-body text-sm text-slate-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
              <option value="latest">Latest</option>
              <option value="oldest">Oldest</option>
              <option value="price-asc">Price (Low to High)</option>
              <option value="price-desc">Price (High to Low)</option>
              <option value="a-z">A to Z</option>
              <option value="z-a">Z to A</option>
            </select>
          </div>
          <button id="apply-filters-btn" class="w-full rounded-xl bg-primary px-6 py-2.5 font-body text-sm font-bold text-white transition hover:bg-primaryHover focus:outline-none focus:ring-2 focus:ring-primary/50 md:w-auto">
            Apply Filters
          </button>
        </div>
      </div>

      <!-- Populated by JS -->
      <div id="listings-status" class="hidden"></div>
      <div id="listings-grid" class="mt-4 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    </section>
  </main>

  <script src="home_script.js" defer></script>
</body>
</html>
