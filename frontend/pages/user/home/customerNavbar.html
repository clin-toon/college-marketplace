<header
  class="sticky top-0 z-50 w-full border-b border-border bg-surface/90 backdrop-blur"
>
  <nav
    class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
    aria-label="Main"
  >
    <!-- Logo -->
    <a href="/" class="flex items-center gap-2">
      <span
        class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-white"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M6 8h12l-1 12H7L6 8Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M9 8V6a3 3 0 0 1 6 0v2"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
      <span class="font-display text-lg font-bold text-ink">CampusCart</span>
    </a>

    <!-- Desktop links -->
    <div class="hidden items-center gap-8 md:flex">
      <a
        href="#"
        class="font-body text-sm font-medium text-ink transition hover:text-primary"
        >Browse</a
      >
      <a
        href="#"
        class="font-body text-sm font-medium text-ink transition hover:text-primary"
        >Categories</a
      >
      <a
        href="#"
        class="font-body text-sm font-medium text-ink transition hover:text-primary"
        >Sell an Item</a
      >
      <a
        href="#"
        class="font-body text-sm font-medium text-ink transition hover:text-primary"
        >How it Works</a
      >
    </div>

    <!-- Desktop actions -->
    <div class="hidden items-center gap-3 md:flex">
      <a
        href="#"
        class="font-body text-sm font-semibold text-ink transition hover:text-primary"
        >Sign In</a
      >
      <a
        href="#"
        class="rounded-lg bg-primary px-4 py-2 font-body text-sm font-semibold text-white transition hover:bg-primaryHover focus:outline-none focus:ring-2 focus:ring-primary/50"
      >
        Get Started
      </a>
    </div>

    <!-- Mobile menu toggle (JS to be wired later) -->
    <button
      id="mobile-menu-button"
      type="button"
      class="inline-flex items-center justify-center rounded-lg p-2 text-ink hover:bg-bg focus:outline-none focus:ring-2 focus:ring-primary/50 md:hidden"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <svg
        class="h-6 w-6"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M4 7h16M4 12h16M4 17h16"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </nav>

  <!-- Mobile menu panel (hidden until JS toggles it) -->
  <div
    id="mobile-menu"
    class="hidden border-t border-border bg-surface md:hidden"
  >
    <div class="space-y-1 px-4 py-3">
      <a
        href="#"
        class="block rounded-lg px-3 py-2 font-body text-sm font-medium text-ink hover:bg-bg"
        >Browse</a
      >
      <a
        href="#"
        class="block rounded-lg px-3 py-2 font-body text-sm font-medium text-ink hover:bg-bg"
        >Categories</a
      >
      <a
        href="#"
        class="block rounded-lg px-3 py-2 font-body text-sm font-medium text-ink hover:bg-bg"
        >Sell an Item</a
      >
      <a
        href="#"
        class="block rounded-lg px-3 py-2 font-body text-sm font-medium text-ink hover:bg-bg"
        >How it Works</a
      >
      <div class="mt-2 flex flex-col gap-2 border-t border-border pt-3">
        <a
          href="#"
          class="rounded-lg px-3 py-2 text-center font-body text-sm font-semibold text-ink hover:bg-bg"
          >Sign In</a
        >
        <a
          href="#"
          class="rounded-lg bg-primary px-3 py-2 text-center font-body text-sm font-semibold text-white hover:bg-primaryHover"
          >Get Started</a
        >
      </div>
    </div>
  </div>
</header>
